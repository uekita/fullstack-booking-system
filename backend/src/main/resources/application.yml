server:
  port: 8080

spring:
  application:
    name: courier-shifts
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/courier_shifts}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
